<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>تقسیم‌بندی حوزه‌های انتخاباتی</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">

<h1 class="text-3xl font-bold mb-6 text-center text-gray-800">تقسیم‌بندی حوزه‌های انتخاباتی</h1>

<!-- صفحه اصلی -->
<div id="mainPage" class="max-w-5xl mx-auto space-y-6">

  <div class="flex justify-end mb-4">
    <button onclick="showSettings()" class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 transition">تنظیمات</button>
  </div>

  <div id="step1" class="bg-white p-6 rounded-xl shadow-md">
    <label class="block mb-3 font-semibold text-gray-700">چند تا حوزه انتخاباتی تعریف کنیم؟</label>
    <input type="number" id="numConstituencies" min="1" value="1" class="border p-3 rounded w-full mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400">
    <button onclick="initConstituencies()" class="bg-blue-500 text-white px-5 py-2 rounded-lg hover:bg-blue-600 transition">ادامه</button>
  </div>

  <div id="step2" class="space-y-6 hidden"></div>
  <div id="step3" class="space-y-6 hidden"></div>

</div>

<!-- صفحه تنظیمات -->
<div id="settingsPage" class="max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-md hidden">
<h2 class="text-2xl font-bold mb-4 text-gray-800">تنظیمات اطلاعات شهرستان‌ها و ضرایب</h2>

<h3 class="font-semibold mb-2">اطلاعات شهرستان‌ها</h3>
<div class="overflow-x-auto mb-6">
<table class="table-auto w-full text-center border border-gray-300">
  <thead class="bg-gray-100">
    <tr>
      <th class="border px-2 py-1">شهرستان</th>
      <th class="border px-2 py-1">جمعیت</th>
      <th class="border px-2 py-1">مساحت (km²)</th>
      <th class="border px-2 py-1">سهم از امکانات (%)</th>
    </tr>
  </thead>
  <tbody id="settingsTableBody"></tbody>
</table>
</div>

<h3 class="font-semibold mb-2">ضرایب شاخص مشغله</h3>
<div class="grid grid-cols-2 gap-4 mb-6">
  <div>
    <label class="block mb-1">جمعیت (%)</label>
    <input type="number" id="weightPopulation" min="0" max="100" class="border p-2 rounded w-full" value="30">
  </div>
  <div>
    <label class="block mb-1">مساحت (%)</label>
    <input type="number" id="weightArea" min="0" max="100" class="border p-2 rounded w-full" value="30">
  </div>
  <div>
    <label class="block mb-1">تنوع فرهنگی (%)</label>
    <input type="number" id="weightDiversity" min="0" max="100" class="border p-2 rounded w-full" value="15">
  </div>
  <div>
    <label class="block mb-1">سهم امکانات استان (%)</label>
    <input type="number" id="weightFacilities" min="0" max="100" class="border p-2 rounded w-full" value="25">
  </div>
</div>

<div class="flex justify-end mt-4 space-x-2">
  <button onclick="saveSettings()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">ذخیره تغییرات</button>
  <button onclick="backToMain()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">بازگشت</button>
</div>
</div>

<script>
let counties = [
  { county: "بیرجند", population: 261300, facilities_share: 19.23, area: 4004 },
  { county: "قاین", population: 116100, facilities_share: 15.38, area: 7601 },
  { county: "زیرکوه", population: 40100, facilities_share: 7.69, area: 8226 },
  { county: "طبس", population: 64600, facilities_share: 15.38, area: 44212 },
  { county: "خوسف", population: 27600, facilities_share: 7.69, area: 16029 },
  { county: "فردوس", population: 45500, facilities_share: 7.69, area: 4103 },
  { county: "سرایان", population: 33300, facilities_share: 3.85, area: 9342 },
  { county: "بشرویه", population: 26000, facilities_share: 3.85, area: 5993 },
  { county: "عشق آباد", population: 8000, facilities_share: 1.92, area: 11200 },
  { county: "نهبندان", population: 51400, facilities_share: 5.77, area: 26094 },
  { county: "درمیان", population: 53700, facilities_share: 3.85, area: 5797 },
  { county: "سربیشه", population: 40900, facilities_share: 7.69, area: 8199 }
];

let weights = { population:30, area:30, diversity:15, facilities:25 };

function showSettings() {
  document.getElementById("mainPage").classList.add("hidden");
  document.getElementById("settingsPage").classList.remove("hidden");
  renderSettingsTable();
  document.getElementById("weightPopulation").value = weights.population;
  document.getElementById("weightArea").value = weights.area;
  document.getElementById("weightDiversity").value = weights.diversity;
  document.getElementById("weightFacilities").value = weights.facilities;
}

function backToMain() {
  document.getElementById("settingsPage").classList.add("hidden");
  document.getElementById("mainPage").classList.remove("hidden");
}

function renderSettingsTable() {
  const tbody = document.getElementById("settingsTableBody");
  tbody.innerHTML = "";
  counties.forEach((c, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="border px-2 py-1">${c.county}</td>
      <td class="border px-2 py-1"><input type="number" class="border p-1 rounded w-24" id="pop_${i}" value="${c.population}"></td>
      <td class="border px-2 py-1"><input type="number" class="border p-1 rounded w-24" id="area_${i}" value="${c.area}"></td>
      <td class="border px-2 py-1"><input type="number" class="border p-1 rounded w-24" id="fac_${i}" value="${c.facilities_share}"></td>
    `;
    tbody.appendChild(tr);
  });
}

function saveSettings() {
  counties.forEach((c, i) => {
    c.population = parseFloat(document.getElementById(`pop_${i}`).value) || 0;
    c.area = parseFloat(document.getElementById(`area_${i}`).value) || 0;
    c.facilities_share = parseFloat(document.getElementById(`fac_${i}`).value) || 0;
  });
  weights.population = parseFloat(document.getElementById("weightPopulation").value) || 0;
  weights.area = parseFloat(document.getElementById("weightArea").value) || 0;
  weights.diversity = parseFloat(document.getElementById("weightDiversity").value) || 0;
  weights.facilities = parseFloat(document.getElementById("weightFacilities").value) || 0;
  alert("اطلاعات ذخیره شد!");
  backToMain();
}

const totalPopulation = () => counties.reduce((s,c)=>s+c.population,0);
const totalArea = () => counties.reduce((s,c)=>s+c.area,0);
const totalCounties = () => counties.length;

function initConstituencies() {
  const num = document.getElementById("numConstituencies").value;
  const step2 = document.getElementById("step2");
  step2.innerHTML = "";

  for (let i=0; i<num; i++) {
    const card = document.createElement("div");
    card.className = "bg-white p-6 rounded-xl shadow-lg";

    card.innerHTML = `
      <h3 class="font-semibold mb-3 text-xl text-gray-800">حوزه ${i+1}</h3>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 mb-4">
        ${counties.map(c => `
          <label class="flex items-center space-x-2">
            <input type="checkbox" class="county-checkbox-input mr-2" id="county_${i}_${c.county}" value="${c.county}" onchange="updateCountyAvailability()">
            <span class="text-gray-700">${c.county}</span>
          </label>
        `).join("")}
      </div>
      <label class="block mb-1 font-medium text-gray-700">تعداد نماینده:</label>
      <input type="number" id="reps_${i}" value="1" min="1" class="border p-2 rounded w-24 focus:outline-none focus:ring-2 focus:ring-blue-400">
    `;
    step2.appendChild(card);
  }

  const btnDiv = document.createElement("div");
  btnDiv.className = "flex space-x-4 mt-4 justify-center";
  btnDiv.innerHTML = `
    <button onclick="calculateResults()" class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600 transition">محاسبه</button>
    <button onclick="resetAll()" class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition">شروع مجدد</button>
  `;
  step2.appendChild(btnDiv);

  document.getElementById("step1").style.display = "none";
  step2.style.display = "block";
}

function updateCountyAvailability() {
  const selectedCounties = Array.from(document.querySelectorAll('.county-checkbox-input'))
    .filter(cb => cb.checked)
    .map(cb => cb.value);

  document.querySelectorAll('.county-checkbox-input').forEach(cb => {
    if (!cb.checked && selectedCounties.includes(cb.value)) {
      cb.disabled = true;
      cb.parentElement.classList.add('opacity-50');
    } else {
      cb.disabled = false;
      cb.parentElement.classList.remove('opacity-50');
    }
  });
}

function calculateResults() {
  const allSelectedCounties = [];
  const num = document.getElementById("numConstituencies").value;
  for (let i=0; i<num; i++) {
    const selected = counties.filter(c => document.getElementById(`county_${i}_${c.county}`).checked);
    selected.forEach(s => allSelectedCounties.push(s.county));
  }
  const missingCounties = counties.map(c => c.county).filter(c => !allSelectedCounties.includes(c));
  if (missingCounties.length > 0) {
    alert("لطفاً همه شهرستان‌ها را حداقل یک بار انتخاب کنید:\n" + missingCounties.join("، "));
    return;
  }

  const step2 = document.getElementById("step2");
  const step3 = document.getElementById("step3");
  step3.innerHTML = "";

  const backBtn = document.createElement("div");
  backBtn.className = "flex justify-end mb-4";
  backBtn.innerHTML = `<button onclick="backToEdit()" class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 transition">بازگشت و اصلاح</button>`;
  step3.appendChild(backBtn);

  for (let i=0; i<num; i++) {
    let selectedCounties = counties.filter(c => document.getElementById(`county_${i}_${c.county}`).checked);
    selectedCounties.sort((a,b)=>a.county.localeCompare(b.county));
    const reps = parseInt(document.getElementById(`reps_${i}`).value);

    const population = selectedCounties.reduce((s,c)=>s+c.population,0);
    const area = selectedCounties.reduce((s,c)=>s+c.area,0);
    const facilitiesShare = selectedCounties.reduce((s,c)=>s+c.facilities_share,0);
    const countyCount = selectedCounties.length;
    const populationPercent = (population/totalPopulation())*100;
    const areaPercent = (area/totalArea())*100;
    const diversityPercent = (countyCount/totalCounties())*100;

    const busynessIndex = ((populationPercent * weights.population/100) +
                           (areaPercent * weights.area/100) +
                           (diversityPercent * weights.diversity/100) +
                           (facilitiesShare * weights.facilities/100)) / reps;

    const resultCard = document.createElement("div");
    resultCard.className = `p-6 rounded-xl shadow-lg mb-6 ${busynessIndex>25?'border-4 border-red-600':'bg-white'}`;
    resultCard.innerHTML = `
      <h3 class="font-bold mb-3 text-lg text-gray-800 text-right">${selectedCounties.map(c=>c.county).join("، ")}</h3>
      <div class="overflow-x-auto">
        <table class="table-auto w-full text-right border border-gray-300">
          <thead class="bg-gray-100">
            <tr>
              <th class="border px-2 py-1">جمعیت</th>
              <th class="border px-2 py-1">درصد جمعیت</th>
              <th class="border px-2 py-1">مساحت (km²)</th>
              <th class="border px-2 py-1">درصد مساحت</th>
              <th class="border px-2 py-1">تعداد شهرستان</th>
              <th class="border px-2 py-1">درصد تعداد شهرستان</th>
              <th class="border px-2 py-1">سهم از امکانات استان</th>
              <th class="border px-2 py-1">تعداد نماینده</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="border px-2 py-1">${population}</td>
              <td class="border px-2 py-1">${populationPercent.toFixed(2)}</td>
              <td class="border px-2 py-1">${area}</td>
              <td class="border px-2 py-1">${areaPercent.toFixed(2)}</td>
              <td class="border px-2 py-1">${countyCount}</td>
              <td class="border px-2 py-1">${diversityPercent.toFixed(2)}</td>
              <td class="border px-2 py-1">${facilitiesShare.toFixed(2)}</td>
              <td class="border px-2 py-1">${reps}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="mt-4 text-right">
        <span class="text-2xl font-bold ${busynessIndex>25?'text-red-600':'text-green-700'}">شاخص مشغله: ${busynessIndex.toFixed(2)}</span>
      </div>
    `;
    step3.appendChild(resultCard);
  }

  step2.style.display = "none";
  step3.style.display = "block";
}

function backToEdit() {
  document.getElementById("step3").style.display = "none";
  document.getElementById("step2").style.display = "block";
}

function resetAll() {
  location.reload();
}
</script>

</body>
</html>
